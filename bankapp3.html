<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueBank</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0d47a1, #42a5f5);
        }

        #bank-app {
            width: min(100%, 420px);
            overflow: hidden;
            background: white;
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(0, 29, 74, 0.35);
        }

        header {
            padding: 28px;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, #0b3d91, #1976d2);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #dbeeff;
        }

        .balance-card {
            margin: 22px;
            padding: 22px;
            color: white;
            text-align: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #1565c0, #42a5f5);
        }

        .balance-card p {
            margin: 0;
            font-size: 14px;
        }

        #balance {
            display: block;
            margin-top: 8px;
            font-size: 38px;
            font-weight: bold;
        }

        .content {
            padding: 0 22px 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #102a43;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #b9d8f6;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px #dbeeff;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s, filter 0.15s;
        }

        button:hover {
            filter: brightness(1.08);
        }

        button:active {
            transform: scale(0.97);
        }

        #deposit-btn {
            color: white;
            background: #138a4a;
        }

        #withdraw-btn {
            color: white;
            background: #e53935;
        }

        #check-btn {
            width: 100%;
            margin-top: 12px;
            color: white;
            background: #1565c0;
        }

        #message {
            min-height: 24px;
            margin: 18px 0 0;
            text-align: center;
            font-weight: bold;
            color: #1565c0;
        }
    </style>
</head>

<body>
    <main id="bank-app">
        <header>
            <h1>Every Ma'am favorite Bank</h1>
            <p>Your simple digital wallet</p>
        </header>

        <section class="balance-card">
            <p>Available Balance</p>
            <span id="balance">₹ 1,000.00</span>
        </section>

        <section class="content">
            <label for="amount">Enter amount</label>
            <input id="amount" type="number" min="1" placeholder="Example: 500">

            <div class="buttons">
                <button id="deposit-btn">Deposit</button>
                <button id="withdraw-btn">Withdraw</button>
            </div>

            <button id="check-btn">Check Balance</button>

            <p id="message">Welcome to BlueBank!</p>
        </section>
    </main>

    <script>
        let balance = 1000;

        const balanceText = document.getElementById("balance");
        const amountInput = document.getElementById("amount");
        const message = document.getElementById("message");

        function playClickSound() {
            const sound = new (AudioContext || webkitAudioContext)();
            const oscillator = sound.createOscillator();
            const volume = sound.createGain();

            oscillator.frequency.value = 650;
            volume.gain.setValueAtTime(0.06, sound.currentTime);
            volume.gain.exponentialRampToValueAtTime(0.001, sound.currentTime + 0.06);

            oscillator.connect(volume);
            volume.connect(sound.destination);
            oscillator.start();
            oscillator.stop(sound.currentTime + 0.06);
        }

        function updateBalance() {
            balanceText.textContent = `₹ ${balance.toFixed(2)}`;
        }

        function getAmount() {
            const amount = Number(amountInput.value);

            if (!amount || amount <= 0) {
                message.textContent = "Please enter a valid amount.";
                message.style.color = "#e53935";
                return null;
            }

            return amount;
        }

        document.getElementById("deposit-btn").addEventListener("click", function () {
            playClickSound();

            const amount = getAmount();
            if (amount === null) return;

            balance += amount;
            updateBalance();

            message.textContent = `₹ ${amount.toFixed(2)} deposited successfully!`;
            message.style.color = "#138a4a";
            amountInput.value = "";
        });

        document.getElementById("withdraw-btn").addEventListener("click", function () {
            playClickSound();

            const amount = getAmount();
            if (amount === null) return;

            if (amount > balance) {
                message.textContent = "Insufficient balance.";
                message.style.color = "#e53935";
                return;
            }

            balance -= amount;
            updateBalance();

            message.textContent = `₹ ${amount.toFixed(2)} withdrawn successfully!`;
            message.style.color = "#1565c0";
            amountInput.value = "";
        });

        document.getElementById("check-btn").addEventListener("click", function () {
            playClickSound();
            message.textContent = `Your balance is ₹ ${balance.toFixed(2)}.`;
            message.style.color = "#1565c0";
        });

        updateBalance();
    </script>
</body>
</html>
